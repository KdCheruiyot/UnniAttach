# ------------------------------------------------------------------
# No secrets live in this file. Everything sensitive comes from
# environment variables (see README.md). Safe to commit.
# ------------------------------------------------------------------
spring.application.name=backend
server.port=${PORT:8080}

# ---- Database ----
# Option A: set DB_URL (jdbc:mysql://host:port/db), DB_USERNAME, DB_PASSWORD
# Option B (Railway): set MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:attaco}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}

# ---- JPA / Hibernate ----
# "update" creates and updates tables automatically. Fine for a student project.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# REQUIRED: random string, at least 32 characters. The app refuses to start without it.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---- First admin account (created on startup if it does not exist) ----
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.first-name=${ADMIN_FIRST_NAME:System}
app.admin.last-name=${ADMIN_LAST_NAME:Admin}

# ---- CORS: comma-separated list of frontend origins allowed to call the API ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# ---- Actuator: only the health check is exposed ----
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---- Swagger UI ----
springdoc.swagger-ui.path=/swagger-ui.html
